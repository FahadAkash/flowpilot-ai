[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "flowpilot"
version = "0.1.0"
description = "FlowPilot AI — Enterprise Tiered Multi-Agent Document Processing & Workflow Orchestrator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pymupdf>=1.24.14",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.10.0",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "hypothesis>=6.119.0",
]

[project.scripts]
flowpilot-benchmark = "flowpilot.benchmarks.runner:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["E501", "S101", "S104", "S105", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live_llm: tests that require real external LLM API keys",
    "postgres: tests that require a live PostgreSQL + pgvector instance",
]
addopts = "-m 'not live_llm and not postgres'"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
mypy_path = "src"
